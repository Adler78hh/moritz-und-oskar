<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d2747">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mo & Os">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}</style>
<title>Mo und Os Abenteuer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: full-bleed canvas stage; sticker-style panels float over the live storybook scenery.
   One deliberate look (bright picture book) for both host themes. */
:root{
  --ink:#24305e;
  --paper:#ffffff;
  --gold:#ffc93c;
  --gold-deep:#e8a21a;
  --red:#e8443a;
  --red-soft:#ffe1dc;
  --blue:#2f74e6;
  --blue-soft:#dde9ff;
  --night:#1d2747;
  --muted:#5b6690;
  --k:#e8443a;
  --font:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--font);overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{display:block;touch-action:none}

button{font-family:var(--font);color:var(--ink);cursor:pointer}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}

/* HUD buttons */
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;z-index:5}
#hudL{left:calc(12px + env(safe-area-inset-left,0px))}
#hudR{right:calc(12px + env(safe-area-inset-right,0px))}
.hudbtn{width:52px;height:52px;border-radius:50%;flex:none;
  border:4px solid var(--ink);background:var(--paper);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;padding:0}
.hearts{display:flex;gap:4px;background:rgba(36,48,94,.55);border-radius:999px;padding:6px 10px}
.hearts svg{width:30px;height:28px;display:block}
.hearts .empty path{fill:rgba(255,255,255,.45)}
.count{display:flex;align-items:center;gap:6px;background:rgba(36,48,94,.55);border-radius:999px;padding:4px 14px 4px 8px;
  color:#fff;font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.count svg{width:30px;height:30px}
.hudbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.hudbtn svg{width:26px;height:26px}
#btnSound.off .wave{display:none}
#btnSound:not(.off) .cross{display:none}

/* The one button */
#jump{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
  width:118px;height:118px;border-radius:50%;border:5px solid var(--ink);
  background:radial-gradient(circle at 36% 30%,#fff0a6 0,var(--gold) 45%,var(--gold-deep) 100%);
  box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  touch-action:none;padding:0;transition:background-color .1s}
#jump svg{width:42px;height:42px}
#jump b{font-weight:800;font-size:17px;line-height:1}
#jump small{font-weight:700;font-size:10.5px;white-space:nowrap;line-height:1.1;color:var(--ink);opacity:.8}
#jump.down{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
#jump.shielding{background:radial-gradient(circle at 36% 30%,#ffffff 0,var(--k) 55%,var(--ink) 130%);color:var(--paper)}
#jump.shielding small,#jump.shielding b{color:var(--paper);opacity:1}

/* Screens */
.screen{position:fixed;inset:0;display:flex;padding:76px 16px 16px;overflow:auto;z-index:3;background:rgba(29,39,71,.28);touch-action:auto}
.panel{margin:auto;width:100%;max-width:660px;background:var(--paper);border:5px solid var(--ink);border-radius:30px;
  box-shadow:0 10px 0 var(--ink);padding:18px 22px 22px;text-align:center;display:flex;flex-direction:column;gap:12px}
.title{margin:0;font-weight:800;line-height:.95;font-size:clamp(28px,5.6vw,46px);text-wrap:balance;letter-spacing:.2px}
.title .m{color:var(--blue)} .title .o{color:var(--red)}
.title .big{display:block;font-size:1.45em;color:var(--gold);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;
  letter-spacing:1px;margin-top:4px}
.lead{margin:0;font-weight:700;font-size:20px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{border:4px solid var(--ink);border-radius:24px;padding:8px 8px 12px;display:flex;flex-direction:column;align-items:center;
  gap:0;box-shadow:0 6px 0 var(--ink);transition:transform .12s;min-width:0}
.card:hover{transform:translateY(-3px) rotate(-1deg)}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.card{background:var(--soft)}
.card canvas{width:100%;max-width:150px;aspect-ratio:200/170;height:auto;display:block}
.card .name{font-weight:800;font-size:24px;line-height:1}
.card .name{color:var(--kc)}
.card .sub{font-weight:600;font-size:13px;color:var(--muted);line-height:1.2}
.roles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.role{border:4px solid var(--ink);border-radius:999px;padding:6px 20px 6px 14px;font-weight:800;font-size:21px;background:var(--paper);
  box-shadow:0 5px 0 var(--ink);display:inline-flex;align-items:center;gap:8px}
.role svg{width:26px;height:26px}
.role[aria-pressed="true"]{background:var(--gold)}
.role:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.howto{margin:0;font-size:15.5px;line-height:1.4;color:var(--muted);max-width:52ch;align-self:center}
.howto b{color:var(--ink)}
.tilt{margin:0;font-size:14px;font-weight:700;color:var(--blue)}

h2{margin:0;font-weight:800;font-size:clamp(26px,4.6vw,38px);line-height:1.05;text-wrap:balance}
.lvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lv{border:4px solid var(--ink);border-radius:22px;padding:0 0 12px;overflow:hidden;background:var(--paper);
  box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.lv .sky{align-self:stretch;height:58px;background:linear-gradient(var(--a),var(--a) 45%,var(--b) 46%,var(--b));position:relative}
.lv .num{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;
  background:var(--gold);border:4px solid var(--ink);font-weight:800;font-size:24px;line-height:36px}
.lv .lvname{margin-top:22px;font-weight:800;font-size:19px;line-height:1.1}
.lv .lvsub{font-size:13px;font-weight:600;color:var(--muted);padding:0 8px;line-height:1.25}
.lv:not(:disabled):hover{transform:translateY(-3px)}
.lv .lvbest{margin-top:4px;font-size:13.5px;font-weight:800;color:var(--ink);background:var(--gold);border-radius:999px;padding:1px 10px;align-self:center}
.lv .lvbest svg{width:15px;height:15px;vertical-align:-2px}
.record{display:inline-block;font-size:18px;background:var(--gold);border:3px solid var(--ink);border-radius:999px;padding:0 12px;vertical-align:4px;transform:rotate(-3deg)}
.recordold{font-size:16px;color:var(--muted);vertical-align:4px}
.card .prog{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3}
.lv:disabled{cursor:not-allowed;filter:grayscale(.85);opacity:.7}
.lv .lock{width:18px;height:18px;vertical-align:-3px}

.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.big-btn{border:4px solid var(--ink);border-radius:999px;padding:8px 26px;font-weight:800;font-size:21px;
  background:var(--gold);box-shadow:0 6px 0 var(--ink)}
.big-btn.plain{background:var(--paper)}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.msgtext{margin:0;font-size:18px;font-weight:600;color:var(--muted)}
.starline{margin:0;font-size:30px;font-weight:800;color:var(--ink)}
.starline svg{width:30px;height:30px;vertical-align:-5px}

@media (max-height:520px){
  .panel{gap:8px;padding:12px 18px 16px}
  .title{font-size:26px} .card canvas{max-width:130px} .card .name{font-size:22px}
  .howto{font-size:13.5px} .lv .sky{height:40px}
  #jump{width:96px;height:96px} #jump svg{width:32px;height:32px} #jump small{display:none}
}
@media (max-width:460px){
  .lvgrid{grid-template-columns:1fr}
  .lv{flex-direction:row;padding:0 12px 0 0;gap:12px;text-align:left}
  .lv .sky{width:70px;height:auto;align-self:stretch;min-height:64px}
  .lv .num{left:auto;right:-22px;bottom:auto;top:50%;transform:translateY(-50%)}
  .lv .lvname{margin-top:0;padding-left:20px} .lv .lvsub{padding-left:20px}
  .lv .txt{display:flex;flex-direction:column}
}
.lv .txt{display:contents}
@media (max-width:460px){ .lv .txt{display:flex;flex-direction:column;padding-block:8px} .lv .lvbest{align-self:flex-start} }
@media (max-width:520px){
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .role{font-size:16px;padding:5px 10px;justify-content:center}
  .role svg{width:20px;height:20px}
  .card{padding:6px 4px 8px;border-radius:18px}
  .card .sub{display:none}
  .card .name{font-size:20px}
}
@media (prefers-reduced-motion:reduce){ .card,.lv{transition:none} }
</style>
</head>
<body>

<div id="stage"><canvas id="game" aria-label="Spielfeld"></canvas></div>

<div class="hud" id="hudL">
<button class="hudbtn" id="btnHome" aria-label="Zum Menü" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>
</button>
<div class="hearts" id="hearts" role="img" aria-label="Leben" hidden></div>
</div>
<div class="hud" id="hudR">
<div class="count" id="count" hidden></div>
<button class="hudbtn" id="btnSound" aria-label="Ton an oder aus" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="cross" d="m16 9.5 5 5m0-5-5 5"/></svg>
</button>
</div>

<button id="jump" aria-label="Springen, gedrückt halten für den Schild" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5.5 11 12 4.5l6.5 6.5"/></svg>
  <b id="jumpLabel">Springen</b><small id="jumpSmall">halten: Schild</small>
</button>

<section class="screen" id="menu">
  <div class="panel">
    <h1 class="title"><span class="m">Mo</span> &amp; <span class="o">Os</span> <span class="big">Abenteuer</span></h1>
    <p class="lead">Was möchtest du sein?</p>
    <div class="roles" role="group" aria-label="Ritter oder Astronaut">
      <button class="role" data-mode="knight" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3 4.5 5.5v6c0 4.6 3.2 8 7.5 9.5 4.3-1.5 7.5-4.9 7.5-9.5v-6z" fill="#ff8f85"/></svg>Ritter</button>
      <button class="role" data-mode="party" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 5.5 20h13z" fill="#ff8fb8"/><circle cx="12" cy="3" r="2" fill="#ffd447"/><circle cx="10" cy="13" r="1.2" fill="#fff" stroke="none"/><circle cx="13.5" cy="9" r="1.1" fill="#fff" stroke="none"/><circle cx="14" cy="16" r="1.2" fill="#fff" stroke="none"/></svg>Geburtstagskind</button>
      <button class="role" data-mode="space" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5c3.5 2.5 5 6 4.6 11.5H7.4C7 8.5 8.5 5 12 2.5z" fill="#cfe3ff"/><circle cx="12" cy="9" r="1.9" fill="#7fd3ff"/><path d="M7.4 14 4.5 17l3.3.6M16.6 14l2.9 3-3.3.6M10 17.5l2 3.5 2-3.5"/></svg>Astronaut</button>
      <button class="role" data-mode="school" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 22 5 7.5h14z" fill="#ffd447"/><path d="M5 7.5c1-3 3-4.5 7-4.5s6 1.5 7 4.5" fill="#ffffff"/><path d="M8.5 13.5h7M10 17h4"/></svg>Schulkind</button>
      <button class="role" data-mode="jedi" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M6 19 18 5" stroke="#9cc0ff" stroke-width="5"/><path d="M6 19 18 5" stroke="#ffffff" stroke-width="2"/><path d="M4 21l3.5-3.5" stroke="currentColor" stroke-width="3.4"/></svg>Junger Jedi</button>
    </div>
    <p class="lead">Und wer spielt?</p>
    <div class="cards">
      <!-- one card per child, built from CHARS -->
    </div>
    <p class="howto" id="howto">Dein Ritter läuft von allein. <b>Kurz tippen</b>: springen. <b>Lang drücken</b>: stehen bleiben und den Schild hochhalten. Der Schild hält Feuerbälle und Eicheln ab.</p>
    <p class="tilt" id="tilt" hidden>Tipp: Das Handy quer halten, dann ist mehr zu sehen.</p>
  </div>
</section>

<section class="screen" id="levels" hidden>
  <div class="panel">
    <h2 id="lvTitle">Wohin geht es?</h2>
    <div class="lvgrid" id="lvgrid"></div>
  </div>
</section>

<section class="screen" id="msg" hidden>
  <div class="panel">
    <h2 id="msgTitle">Hurra!</h2>
    <p class="starline" id="msgStars"></p>
    <p class="msgtext" id="msgText"></p>
    <div class="row"><button class="big-btn" id="msgA">Weiter</button><button class="big-btn plain" id="msgB">Zum Menü</button></div>
  </div>
</section>

<script>
(() => {
'use strict';
const T = 48, H = 540, GY = 432, MAX_HEARTS = 3;
const SPEED = 215, GRAV = 2400, JV = 900, HOLD = 0.22;
const FONT = '"Baloo 2","Trebuchet MS","Segoe UI",sans-serif';
const $ = id => document.getElementById(id);

// All playable children. Only short names (first syllable) are shown in the game.
// Two children share "Os": the second one is told apart by colour, hair and the label "Os W.".
const CHARS = [
  { id:'moritz', name:'Mo', letter:'Mo', word:'blau', sex:'m', color:'#2f74e6', dark:'#1c4aa6', light:'#9cc0ff',
    hair:{ style:'spiky', curl:true, c:'#ffd447', d:'#e0a92a', l:'#fff1a6' }, face:'round' },
  { id:'oskar', name:'Os', letter:'Os', word:'rot', sex:'m', color:'#e8443a', dark:'#a92a2a', light:'#ff9d8f',
    hair:{ style:'spiky', c:'#ffd447', d:'#e0a92a', l:'#fff1a6' }, face:'round' },
  { id:'ida', name:'Id', letter:'Id', word:'taubenblau', sex:'f', color:'#7f97ba', dark:'#556a8c', light:'#cdd9ea',
    hair:{ style:'braid', c:'#ffd447', d:'#e0a92a', l:'#fff1a6', tie:'#556a8c' }, face:'round' },
  { id:'lu', name:'Lu', letter:'Lu', word:'türkisfarben', sex:'m', color:'#25c2b3', dark:'#168478', light:'#a8eee6',
    hair:{ style:'wavy', c:'#ffd447', d:'#e0a92a', l:'#fff1a6' }, face:'round' },
  { id:'kilian', name:'Ki', letter:'Ki', word:'bordeauxrot', sex:'m', color:'#8e1f3a', dark:'#5e1226', light:'#d77a91',
    hair:{ style:'wavy', c:'#c9a05a', d:'#987434', l:'#e6c991' }, face:'long' },
  { id:'finnc', name:'Finn', letter:'Finn', word:'gelb', sex:'m', color:'#f2c230', dark:'#c4931a', light:'#ffe58a', ink:'#7a4a00',
    hair:{ style:'short', c:'#ffd447', d:'#e0a92a', l:'#fff1a6' }, face:'long' },
  { id:'theo', name:'The', letter:'The', word:'braun', sex:'m', color:'#8a5a35', dark:'#5e3c22', light:'#c99d74',
    hair:{ style:'bob', c:'#c9a05a', d:'#987434', l:'#e6c991' }, face:'round' },
  { id:'oskarw', name:'Os W.', letter:'Os', word:'grün', sex:'m', color:'#2f9e4f', dark:'#1f6e36', light:'#8fdca6',
    hair:{ style:'mohawk', c:'#fff0a6', d:'#e0c25a', l:'#ffffff' }, face:'pointy' },
  { id:'finniv', name:'Fin', letter:'Fin', word:'lindgrün', sex:'m', color:'#9ad93a', dark:'#6aa21c', light:'#d6f59e', ink:'#3d5a0a',
    hair:{ style:'buzz', c:'#b0805a', d:'#8a5f3e', l:'#cfa47e' }, face:'round' },
  { id:'lenia', name:'Le', letter:'Le', word:'rosa', sex:'f', color:'#ff8fb8', dark:'#d9558a', light:'#ffd0e2',
    hair:{ style:'long', c:'#ffd447', d:'#e0a92a', l:'#fff1a6' }, face:'round', glasses:true },
  { id:'freya', name:'Fre', letter:'Fre', word:'lila', sex:'f', color:'#8b5cd6', dark:'#5f3aa0', light:'#cbb2f5',
    hair:{ style:'longwavy', c:'#5a3a28', d:'#3a2418', l:'#8a5f45' }, face:'round' },
];
const KNIGHTS = Object.fromEntries(CHARS.map(k => [k.id, k]));
// grammar helpers for the role names
const INDECL = ['rosa', 'lila', 'altrosa'];
function roleLabel(k, m){
  const adj = INDECL.includes(k.word) ? k.word : k.word + 'e';
  if (m === 'school') return `das ${adj} Schulkind`;
  if (m === 'party') return `das ${adj} Geburtstagskind`;
  const f = k.sex === 'f', art = f ? 'die' : 'der';
  if (m === 'space') return `${art} ${adj} ${f ? 'Astronautin' : 'Astronaut'}`;
  if (m === 'jedi') return `${art} ${adj} junge Jedi`;
  return `${art} ${adj} ${f ? 'Ritterin' : 'Ritter'}`;
}

const THEMES = [
  { skyTop:'#6ec3ff', skyBot:'#d6f1ff', far:'#a6d9a4', castleFar:'#eef0fb', roof:'#ff7b7b', near:'#78c86a',
    treeA:'#4fb35a', treeB:'#86d873', trees:'round', grass:'#66cc4e', grassHi:'#9be57e', dirt:'#c27e4c', dirtDots:'#a3653a',
    plank:'#d99a5b', plankDark:'#a86c38', stone:'#d3d4e3', stoneDark:'#9a9bb0', water:'#59b7f2', obstacle:'hay',
    dragons:['#7fd88a','#ff9fc4'], baby:'#ff9d5c', flowers:['#ff6f91','#ffd93d','#ffffff','#b48cff'], sun:true },
  { skyTop:'#7dd8c9', skyBot:'#eafff4', far:'#93cdb0', castleFar:'#f2ecff', roof:'#a77bff', near:'#5fb98a',
    treeA:'#ff6b7f', treeB:'#fff3e0', trees:'mushroom', grass:'#4fc27a', grassHi:'#8ee6a8', dirt:'#8b6a55', dirtDots:'#6f5242',
    plank:'#e0a66b', plankDark:'#a8743f', stone:'#c3ced4', stoneDark:'#8a98a0', water:'#4fc3d9', obstacle:'rock',
    dragons:['#b59cff','#ffb86b','#6fd0ff'], baby:'#7fc8ff', flowers:['#ff7aa8','#fff27a','#9be7ff'], sun:true },
  { skyTop:'#ff9eb5', skyBot:'#ffe4b8', far:'#caa5dd', castleFar:'#f6e9ff', roof:'#5b6fd6', near:'#a585cf',
    treeA:'#5f8f6a', treeB:'#4b7a58', trees:'pine', grass:'#7cc65a', grassHi:'#b2e88c', dirt:'#9a6b8a', dirtDots:'#7e5470',
    plank:'#c98d5a', plankDark:'#93603a', stone:'#ddd0ee', stoneDark:'#a796c2', water:'#7aa6f0', obstacle:'barrel',
    dragons:['#ff7f6b','#5fd4c4','#ffd25e','#9c8cff'], baby:'#b38cff', flowers:['#ffd25e','#ff8fab','#ffffff'], sun:false },
];

// Level pieces. Rows 0..5 (5 = ground). '#' ground, '.' or ' ' empty, '=' plank (jump through from below),
// 'B' stone block, 'h' obstacle, '*' star, 's' snail, 'f' frog, 'b' bee, 'd' baby dragon, 'k' mushroom,
// '!' sign, 'G' castle gate.
const CH = {
  start:     {2:'        **', 3:'       *  *', 5:'############'},
  end:       {5:'########################'},
  flat:      {2:'   **', 3:'  *  *', 5:'########'},
  flat2:     {1:'    **', 2:'   *  *', 4:'         *', 5:'##########'},
  rock:      {2:'    *', 4:'    h', 5:'########'},
  rocks2:    {2:'   *     *', 4:'   h     h', 5:'############'},
  gap2:      {3:'   **', 5:'###..###'},

        if (o && o.alive){ const dx = o.x - q.x, dy = o.y - q.y, l = Math.hypot(dx, dy) || 1; q.vx = dx / l * 380; q.vy = dy / l * 380; }

/* ---------- sucking ---------- */
function tueteMouth(){ return { x:p.x + p.w / 2 + 22, y:p.y - 82 }; }
// Suction only reaches a funnel straight above the cone: narrow at the opening, a little wider higher up.
const SUCK_UP = 170, SUCK_BASE = 22, SUCK_SPREAD = 0.35;
function inFunnel(sx, sy, m, extra){
  const dy = m.y - sy;
  if (dy < -24 || dy > SUCK_UP + extra) return false;
  return Math.abs(sx - m.x) <= SUCK_BASE + Math.max(0, dy) * SUCK_SPREAD + extra;
}
let slurpT = 0;
function suckSweets(dt){
  if (!p.suck) return;
  slurpT -= dt; if (slurpT <= 0){ slurpT = 0.14; tone(180 + Math.random() * 60, 420, 0.12, 'sine', 0.035); }
  const m = tueteMouth();
  for (const s of lvl.sweets){
    if (s.got) continue;
    if (!inFunnel(s.x, s.y, m, s.spin !== undefined ? 30 : 0)) continue;
    const d = Math.hypot(s.x - m.x, s.y - m.y);
    const pull = Math.min(1, dt * (5 + 600 / Math.max(40, d)));
    s.x += (m.x - s.x) * pull; s.y += (m.y - s.y) * pull; s.spin = (s.spin || 0) + dt * 12;
    if (Math.random() < 0.3) addPart({ kind:'spark', x:s.x, y:s.y, vx:(m.x - s.x) * 2, vy:(m.y - s.y) * 2, life:0.25, max:0.25, g:0, size:3, color:'#ffffff' });
    if (Math.hypot(s.x - m.x, s.y - m.y) < 18){ s.got = true; got++; sfx('star'); sparkle(m.x, m.y, SWEET_COLS[s.c % SWEET_COLS.length], 8); }
  }
}

/* =====================================================================
   BIRTHDAY MODE: a Donkey-Kong-like tower, one screen wide, climbing up.
   Tap = jump (through the waffle floors). Hold = stop and throw the gift up:
   it knocks over the giant sweet that plugs the hole in a chocolate ceiling.
   Gummy-bear walls bounce the child and the rolling sweets back.
   ===================================================================== */
const PW = 720, WL = 40, WR = PW - 40, FLOOR_DY = 130, PSPEED = 165, PTHICK = 18;
const PTHEMES = [
  { look:'saal', top:'#ffd0e2', bot:'#fff4f8', paper:'#ffe3ee', stripe:'#ffd3e4', plank:'#f3c98b', plankDark:'#c9944f', icing:'#ff9fc4', accent:'#ff8fb8' },
  { look:'zimmer', top:'#cfe8ff', bot:'#f2f9ff', paper:'#e2f1ff', stripe:'#cfe6fb', plank:'#f0c27f', plankDark:'#c08a45', icing:'#9fd8ff', accent:'#6fb6f0' },
  { look:'garten', top:'#7cc8ff', bot:'#e8f8ff', paper:'#bfe6ff', stripe:'#b0dcf8', plank:'#e8bb7c', plankDark:'#b9874a', icing:'#b8ec9a', accent:'#5fbf6a' },
];
const PLEVELS = [
  { name:'Partysaal', sub:'Gummibärchen-Wände und rollende Bonbons', floors:8, barriers:[4, 8], spawn:5.0, speed:85, kinds:['bonbon', 'linse'] },
  { name:'Spielzimmer', sub:'Höher hinauf, mit hüpfenden Donuts', floors:10, barriers:[3, 7, 10], spawn:4.2, speed:94, kinds:['bonbon', 'linse', 'donut'] },
  { name:'Garten-Party', sub:'Der höchste Turm und die größte Torte', floors:12, barriers:[4, 8, 12], spawn:3.6, speed:102, kinds:['bonbon', 'linse', 'donut'] },
];
const BEAR_COLS = ['#ff5d6c', '#ffb52e', '#ffe14d', '#7ad15b', '#ff9fd6', '#f4f4f4', '#8f7bff'];
let camY = 0;

function surfY(f, x){ return f.yc + f.tilt * (x - PW / 2); }
function overSurface(f, x, roller){
  if (x < WL - 2 || x > WR + 2) return false;
  if (roller && f.hole && Math.abs(x - f.hole.x) < f.hole.w / 2 - 6) return false; // the big sweet and the cotton candy let sweets through
  if (f.gap && x > f.gap[0] && x < f.gap[1]) return false;
  if (f.hole && f.hole.open && Math.abs(x - f.hole.x) < f.hole.w / 2) return false;
  return true;
}

function buildParty(i){
  const L = PLEVELS[i], th = PTHEMES[i], N = L.floors;
  const HH = 60 + N * FLOOR_DY + 270;
  const floors = [], barriers = [], stars = [], signs = [];
  for (let k = 0; k <= N; k++){
    const low = k % 2 === 0 ? 1 : -1;            // +1: right end is lower, -1: left end is lower
    const solid = L.barriers.includes(k);
    const f = { k, yc: HH - 60 - k * FLOOR_DY, tilt: k === N ? 0 : low * 16 / (WR - WL), low, solid, gap:null, hole:null };
    if (k > 0 && !solid) f.gap = low > 0 ? [WR - 150, WR - 72] : [WL + 72, WL + 150];
    if (solid){
      const lowPrev = (k - 1) % 2 === 0 ? 1 : -1;  // hole above the high end of the floor below
      f.hole = { x: lowPrev > 0 ? WL + 175 : WR - 175, w: 86, open:false };
      barriers.push({ floor:k, x:f.hole.x, kind:['lolli', 'cupcake', 'kuss'][barriers.length % 3], state:'stand', t:0, side: lowPrev > 0 ? -1 : 1 });
    }
    floors.push(f);
  }
  const top = floors[N];
  // top floor: hole on one side, table on the other; in between lies the jar, its opening facing the hole
  const left = top.hole.x < PW / 2;
  const tableX = left ? WR - 150 : WL + 150;
  const jarDir = left ? -1 : 1, jarX = top.hole.x - jarDir * (top.hole.w / 2 + 78);
  // balloons to collect: two per floor, some low (walk into them), some high (jump)
  for (let k = 0; k < N; k++){
    const f = floors[k], xs = [WL + 110, PW / 2, WR - 110].filter(x => overSurface(f, x) && !(f.hole && Math.abs(x - f.hole.x) < 80));
    const a = Math.floor(hash(k * 7 + i) * xs.length), b = (a + 1) % xs.length;
    for (const x of [xs[a], xs[b]]) if (x !== undefined) stars.push({ x, y: surfY(f, x) - (hash(k * 13 + x) < 0.5 ? 58 : 92), got:false, col: BEAR_COLS[(k + stars.length) % 5] });
  }
  let hk = Math.round(N * 0.66); while (floors[hk].solid) hk--;
  const mid = floors[hk];
  const heal = [{ x: PW / 2, y: surfY(mid, PW / 2) - 52, got:false }];
  for (const b of barriers) b.x = floors[b.floor].hole.x;
  if (i === 0){
    signs.push({ x: WL + 210, y: surfY(floors[0], WL + 210), text:'Kurz tippen: springen!' });
    const fb = floors[L.barriers[0] - 1], hx = floors[L.barriers[0]].hole.x;
    signs.push({ x: hx + (hx < PW / 2 ? 150 : -150), y: surfY(fb, hx), text:'Lang drücken: Geschenk werfen!' });
  }
  return { party:true, mode:'party', i, th, L, N, HH, floors, barriers, rollers:[], stars, heal, signs, tableX, enemies:[], cps:[],
    width: PW, totalStars: stars.length, spawnT: 1.5, squish:[], giftAnim:null, jarX, jarDir, goal:{ x: tableX, y: surfY(top, tableX) } };
}
function newPartyPlayer(){
  const f = lvl.floors[0], x = WL + 30;
  return { x, y: surfY(f, x + 14), w:28, h:60, vx:0, vy:0, prevY:0, dir:1, onGround:true, coyote:0, jumpBuf:0, inv:0, phase:0,
    hidden:false, rot:0, freeze:0, shield:false, stand:false, gift:null, floor:0 };
}

function squishWall(side, y){ lvl.squish.push({ side, y, t:0 }); }
function updatePartyPlayer(dt){
  const heldT = input.down ? now() - input.t0 : 0;
  const holding = input.down && heldT >= HOLD && p.onGround;
  if (holding && !p.gift){ p.gift = { oy:0, vy:-700, hit:false }; sfx('throw'); }
  p.stand = holding || (p.gift && p.onGround && p.gift.oy < -4);
  if (p.jumpBuf > 0 && (p.onGround || p.coyote > 0)){
    p.vy = -JV; p.onGround = false; p.coyote = 0; p.jumpBuf = 0; sfx('jump'); dust(p.x + p.w / 2, p.y);
  }
  p.jumpBuf -= dt; p.coyote -= dt; if (p.inv > 0) p.inv -= dt;
  // the thrown gift
  if (p.gift){
    const gf = p.gift; gf.oy += gf.vy * dt; gf.vy += 1500 * dt;
    const gx = p.x + p.w / 2 + 4, gy = p.y - 40 + gf.oy;
    if (gf.vy < 0){
      for (const b of lvl.barriers){
        if (b.state !== 'stand' || gf.hit) continue;
        const under = surfY(lvl.floors[b.floor], b.x) + PTHICK;
        if (Math.abs(gx - b.x) < 64 && gy - 12 <= under && gy > under - 130){
          gf.hit = true; gf.vy = 160; b.state = 'fall'; b.t = 0; sfx('stomp'); sparkle(b.x, under - 20, '#ffffff', 14);
        }
      }
    }
    for (const q of lvl.rollers){ // rolling sweets are knocked away whether the gift goes up or comes down
      const hop = q.kind === 'donut' ? Math.abs(Math.sin(q.born * 5)) * 9 : 0;
      if (!q.dead && gf.oy < -8 && Math.hypot(q.x - gx, q.y - hop - gy) < q.r + 14){
        q.dead = true; sfx('stomp'); sparkle(q.x, q.y, q.col, 12); puff(q.x, q.y, 5);
      }
    }
    if (gf.oy >= 0 && gf.vy > 0){ p.gift = null; sfx('catch'); }
  }
  p.vx = (p.stand || p.freeze > 0) ? 0 : p.dir * PSPEED;
  if (p.freeze > 0) p.freeze -= dt;
  const was = p.onGround;
  p.prevY = p.y;
  p.x += p.vx * dt;
  if (p.x < WL){ p.x = WL; if (p.dir < 0){ p.dir = 1; squishWall(-1, p.y - 30); sfx('boing'); } }
  if (p.x + p.w > WR){ p.x = WR - p.w; if (p.dir > 0){ p.dir = -1; squishWall(1, p.y - 30); sfx('boing'); } }
  p.vy = Math.min(p.vy + GRAV * dt, 1200);
  p.y += p.vy * dt; p.onGround = false;
  const cx = p.x + p.w / 2;
  if (p.vy >= 0){
    let best = null;
    for (const f of lvl.floors){
      const s = surfY(f, cx);
      if (p.prevY <= s + 4 && p.y >= s && overSurface(f, cx) && (!best || s < best.s)) best = { f, s };
    }
    if (best){
      p.y = best.s; p.vy = 0; p.onGround = true; p.floor = best.f.k;
      // once the child is up, the hole closes behind it (sprinkles patch), so it cannot fall back through
      const h = best.f.hole;
      if (h && h.open){ h.open = false; h.patched = true; sparkle(h.x, best.f.yc, '#ffffff', 10); }
    }
  } else {
    for (const f of lvl.floors){
      if (!f.solid) continue;
      const under = surfY(f, cx) + PTHICK, top = p.y - p.h, prevTop = p.prevY - p.h;
      if (prevTop >= under - 2 && top <= under && !(f.hole.open && Math.abs(cx - f.hole.x) < f.hole.w / 2 - 6)){ p.y = under + p.h; p.vy = 40; }
    }
  }
  if (p.onGround){ p.coyote = 0.1; if (!was) dust(cx, p.y); }
  if (p.onGround && p.vx !== 0) p.phase += dt * 13;
  // barriers fall over, then their hole opens
  for (const b of lvl.barriers){
    if (b.state !== 'fall') continue;
    b.t += dt;
    if (b.t > 0.9){ b.state = 'gone'; lvl.floors[b.floor].hole.open = true; const y = surfY(lvl.floors[b.floor], b.x); sparkle(b.x, y - 50, '#ffe36b', 16); puff(b.x, y - 40, 10); sfx('heal'); }
  }
  for (const s of lvl.squish) s.t += dt;
  lvl.squish = lvl.squish.filter(s => s.t < 0.4);
}

function nextLockedFloor(){
  for (const b of lvl.barriers) if (b.state === 'stand' && b.floor > p.floor) return b.floor;
  return null;
}
function spawnRoller(anywhere){
  const L = lvl.L, top = lvl.floors[lvl.N];
  let F = lvl.N, dir = lvl.jarDir, x = lvl.jarX + dir * 38;
  if (anywhere !== false){ // at the start a few sweets are already rolling, on the floors just above the child
    F = Math.min(lvl.N - 1, anywhere); const f = lvl.floors[F]; x = f.low > 0 ? WL + 60 + Math.random() * 120 : WR - 60 - Math.random() * 120; dir = f.low;
  } else if (p && p.floor === F && Math.abs(p.x + 14 - x) < 90) return;
  const f = lvl.floors[F], kind = L.kinds[Math.floor(Math.random() * L.kinds.length)];
  const r = kind === 'linse' ? 14 : kind === 'donut' ? 18 : 16;
  lvl.rollers.push({ x, y: surfY(f, x) - r, r, kind, dir, vy:0, floor:F, bounces:0, rot:0, col: BEAR_COLS[Math.floor(Math.random() * 5)], born:0 });
}
function updateParty(dt, active){
  const L = lvl.L;
  if (active){
    lvl.spawnT -= dt;
    if (lvl.spawnT <= 0 && lvl.rollers.length < 6){
      lvl.spawnT = L.spawn * (0.8 + Math.random() * 0.4);
      spawnRoller(false);
    }
  }
  for (const q of lvl.rollers){
    q.born += dt;
    const sp = L.speed;
    if (q.floor !== null){
      const f = lvl.floors[q.floor];
      q.x += q.dir * sp * dt; q.rot += q.dir * sp * dt / q.r;
      if (q.x - q.r < WL){ q.x = WL + q.r; q.dir = 1; q.bounces++; squishWall(-1, q.y); }
      if (q.x + q.r > WR){ q.x = WR - q.r; q.dir = -1; q.bounces++; squishWall(1, q.y); }
      if (!overSurface(f, q.x, true)){ q.floor = null; q.vy = 0; }
      else q.y = surfY(f, q.x) - q.r;
    } else {
      const prevB = q.y + q.r;
      q.vy += 1800 * dt; q.y += q.vy * dt;
      for (const f of lvl.floors){
        const s = surfY(f, q.x);
        if (prevB <= s + 4 && q.y + q.r >= s && overSurface(f, q.x, true)){ q.floor = f.k; q.y = s - q.r; q.vy = 0; break; }
      }
    }
    if (q.bounces >= 7 || (q.floor === 0 && q.bounces >= 1) || q.y > lvl.HH + 100){ q.dead = true; puff(q.x, q.y, 6); continue; }
    if (!active || state !== 'play') continue;
    const hop = q.kind === 'donut' ? Math.abs(Math.sin(q.born * 5)) * 9 : 0;
    const pb = { x: p.x + 4, y: p.y - p.h + 8, w: p.w - 8, h: p.h - 8 };
    if (circBox({ x:q.x, y:q.y - hop, r:q.r - 2 }, pb)){
      if (p.vy > 60 && p.prevY <= q.y - hop - q.r + 10){ q.dead = true; p.vy = -460; sfx('stomp'); sparkle(q.x, q.y, q.col, 10); }

}
function checkPartyGoal(){

function drawGummyWalls(){

function drawFloorPiece(f, a, b, th){

function drawFloors(th){
  for (const f of lvl.floors){
    const ys = surfY(f, PW / 2); if (ys < camY - 60 || ys > camY + H + 60) continue;

    if (f.hole) cuts.push([f.hole.x - f.hole.w / 2, f.hole.x + f.hole.w / 2]);
    let a = WL;
    for (const [c0, c1] of cuts.sort((m, n) => m[0] - n[0])){ if (c0 > a) drawFloorPiece(f, a, c0, th); a = c1; }
    if (a < WR) drawFloorPiece(f, a, WR, th);
    if (f.k === 0){ g.fillStyle = th.plankDark; g.fillRect(WL, surfY(f, WL) + PTHICK - 2, WR - WL, 80); }
  }
}

  const par = 0.45, off = camY * par;
  if (th.look === 'garten'){
    g.fillStyle = '#ffe066'; circ(g, W * 0.82, 90 - off * 0.1, 40); g.fill();
    for (let i = 0; i < 6; i++){ const x = mod(i * 260 + 40 - t * 6, W + 300) - 150, y = mod(60 + i * 170 - off * 0.6, H + 200) - 100; g.globalAlpha = 0.9; cloud(x, y, 0.8); g.globalAlpha = 1; }
    const groundY = lvl.HH - 50 - camY;
    g.fillStyle = '#8ccd72'; g.fillRect(0, groundY - 40, W, H);
    for (let i = 0; i < 10; i++){ const x = i * 140 + 30; g.fillStyle = '#5aa85f'; circ(g, x, groundY - 60, 40); g.fill(); g.fillStyle = '#9a6a43'; g.fillRect(x - 5, groundY - 30, 10, 30); }
  } else {
    // wallpaper stripes
    g.fillStyle = th.stripe; for (let x = 0; x < W; x += 56) g.fillRect(x, 0, 24, H);
    if (th.look === 'zimmer'){ g.fillStyle = 'rgba(255,255,255,.6)'; for (let i = 0; i < 40; i++){ circ(g, hash(i) * W, mod(hash(i + 40) * 1400 - off, 1400) - 200, 4); g.fill(); } }
    // windows with sky
    for (let i = -1; i < 4; i++){
      const wy = mod(i * 420 + 120 - off, 1680) - 300;
      for (const wx of [W * 0.08, W * 0.92 - 110]){
        g.fillStyle = '#ffffff'; rr(g, wx - 6, wy - 6, 122, 152, 14); g.fill();
        g.fillStyle = '#8fd3ff'; rr(g, wx, wy, 110, 140, 10); g.fill();
        g.globalAlpha = 0.9; cloud(wx + 30, wy + 50, 0.45); g.globalAlpha = 1;
        g.fillStyle = '#ffffff'; g.fillRect(wx + 52, wy, 6, 140); g.fillRect(wx, wy + 66, 110, 6);
      }
    }
  }
  // garlands (pennants or lanterns) and floating balloons
  g.globalAlpha = 0.55;
  for (let i = 0; i < 5; i++){
    const y = mod(i * 300 + 60 - off, 1500) - 200;
    g.strokeStyle = th.look === 'garten' ? '#7a5a45' : '#c9944f'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, y); g.quadraticCurveTo(W / 2, y + 50, W, y); g.stroke();
    for (let x = 30; x < W; x += 50){
      const yy = y + 50 * (1 - Math.pow((x - W / 2) / (W / 2), 2)) * 0.5;
      if (th.look === 'garten'){ g.fillStyle = BEAR_COLS[(x / 50 + i) % 5 | 0]; ell(g, x, yy + 14, 11, 14); g.fill(); g.fillStyle = 'rgba(255,255,255,.3)'; ell(g, x - 3, yy + 10, 3, 6); g.fill(); }
      else { g.fillStyle = BEAR_COLS[(x / 50 + i) % 6 | 0]; g.beginPath(); g.moveTo(x - 13, yy); g.lineTo(x + 13, yy); g.lineTo(x, yy + 24); g.closePath(); g.fill(); }
    }
  }
  g.globalAlpha = 1;
  for (let i = 0; i < 8; i++){
    const x = mod(hash(i + 3) * W + Math.sin(t * 0.7 + i) * 20, W), y = mod(H + 80 - (t * 18 + i * 140) - off * 0.3, H + 200) - 100;
    g.globalAlpha = 0.55; drawBalloon(x, y, BEAR_COLS[i % 6], 1.2); g.globalAlpha = 1;
  }
}
function renderParty(){
  const th = lvl.th, ox = Math.round((W - PW) / 2);
  cam = 0;
  drawPartyBg(th);
  g.save(); g.translate(ox, -camY);
  g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(WL, camY - 10, WR - WL, H + 20);
  drawFloors(th);
  drawSigns();
  drawCandyJar();
  for (const q of lvl.rollers) drawRoller(q);
  drawCottonCandy();
  drawTable();
  for (const b of lvl.barriers) drawBarrier(b);
  drawPartyBalloons(); drawHealHearts();
  const inGame = state !== 'menu' && state !== 'levels';
  if (p && inGame) drawPlayer();
  drawGummyWalls();

}

/* ---------- game state ---------- */
let state = 'menu', lvlIndex = 0, cam = 0, t = 0, readyT = 0, endT = 0, hearts = 3, got = 0, playT = 0;
let p = null, projs = [], parts = [], cp = null;
const input = { down:false, t0:0 };
const now = () => performance.now() / 1000;

function newPlayer(x, y){ return { x, y, w:28, h:60, vx:0, vy:0, prevY:y, onGround:true, coyote:0, jumpBuf:0, shield:false, inv:0, phase:0, blocked:false, hidden:false, rot:0, freeze:0 }; }

function startLevel(i){
  lvlIndex = i;
  if (mode === 'space'){ lvl = buildSpace(i); p = newAstro(); }
  else if (mode === 'party'){ lvl = buildParty(i); p = newPartyPlayer(); partyCamera(0, true); for (const k of [2, 4]) spawnRoller(k); }
  else { lvl = buildLevel(i, mode); p = newPlayer(60, GY); }
  cp = { x:60, y:GY };
  hearts = 3; got = 0; projs = []; parts = []; playT = 0;
  input.down = false;
  state = 'ready'; readyT = 1.7; cam = 0;
  showScreen(null);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

function hurt(){
  if (p.inv > 0 || state !== 'play') return;
  hearts--; sfx('hurt');
  puff(p.x + p.w / 2, p.y - 30, 6);
  if (hearts <= 0){ state = 'dying'; p.vy = lvl.space ? -250 : -650; p.shield = false; p.suck = false; endT = 1.4; sfx('over'); return; }
  if (lvl.space){ p.inv = 2.5; p.vy = Math.min(p.vy, -60); return; }
  p.inv = 1.6; p.vy = -330; p.onGround = false;
}
function fellDown(){
  hearts--; sfx('fall');
  if (hearts <= 0){ state = 'dying'; p.hidden = true; endT = 0.9; setTimeout(() => sfx('over'), 300); return; }
  p.x = cp.x; p.y = cp.y; p.vy = 0; p.inv = 2; p.freeze = 0.8; p.shield = false; projs = [];
  sparkle(p.x + p.w / 2, p.y - 30, '#ffffff', 14);
}

function press(){ if (input.down) return; input.down = true; input.t0 = now(); audio(); if (lvl.space && p && state === 'play') p.vy = Math.min(p.vy, -140); }
function release(){
  if (!input.down) return; input.down = false;
  if (!lvl.space && now() - input.t0 < HOLD && (state === 'play' || state === 'ready') && p) p.jumpBuf = 0.16;
}

/* ---------- update ---------- */
function updatePlayer(dt){
  const heldT = input.down ? now() - input.t0 : 0;
  if (lvl.school){
    p.suck = input.down && heldT >= HOLD;
    if (p.suck) p.jumpBuf = 0;
  } else {
    const sh = input.down && heldT >= HOLD && p.onGround;
    if (sh && !p.shield) sfx('shield');
    p.shield = sh;
  }
  if (p.freeze > 0){ p.freeze -= dt; p.jumpBuf = 0; }
  p.vx = (p.shield || p.freeze > 0) ? 0 : SPEED;
  if (p.jumpBuf > 0 && (p.onGround || p.coyote > 0)){
    p.vy = -JV; p.onGround = false; p.coyote = 0; p.jumpBuf = 0; sfx('jump'); dust(p.x + p.w / 2, p.y);
  }
  p.jumpBuf -= dt; p.coyote -= dt; if (p.inv > 0) p.inv -= dt;
  const was = p.onGround;
  p.prevY = p.y;
  // horizontal
  p.blocked = false;
  if (p.vx > 0){
    p.x += p.vx * dt;
    const r0 = Math.floor((p.y - p.h + 1) / T), r1 = Math.floor((p.y - 1) / T), c = Math.floor((p.x + p.w) / T);
    for (let r = r0; r <= r1; r++) if (solidAt(c, r)){ p.x = c * T - p.w - 0.01; p.blocked = true; break; }
  }
  // vertical
  p.vy = Math.min(p.vy + GRAV * dt, 1200);
  p.y += p.vy * dt; p.onGround = false;
  const c0 = Math.floor((p.x + 2) / T), c1 = Math.floor((p.x + p.w - 2) / T);
  if (p.vy >= 0){
    const ra = Math.floor(p.prevY / T), rb = Math.floor(p.y / T);
    outer: for (let r = ra; r <= rb; r++){
      const top = r * T;
      if (p.prevY <= top + 0.5 && p.y >= top){
        for (let c = c0; c <= c1; c++){
          const tt = tileAt(c, r);
          if (tt === '#' || tt === 'B' || tt === 'h' || tt === '='){ p.y = top; p.vy = 0; p.onGround = true; break outer; }
        }
      }
    }
  } else {
    const r = Math.floor((p.y - p.h) / T);
    for (let c = c0; c <= c1; c++) if (solidAt(c, r)){ p.y = (r + 1) * T + p.h; p.vy = 0; break; }
  }
  if (p.onGround){ p.coyote = 0.1; if (!was) dust(p.x + p.w / 2, p.y); }
  if (p.onGround && p.vx > 0 && !p.blocked) p.phase += dt * 13;
  for (const c of lvl.cps) if (c.x <= p.x && c.x > cp.x) cp = c;
  if (p.y > H + 70) fellDown();
}

function ebox(e){
  switch (e.type){
    case 's': return { x:e.x - 22, y:e.y - 28, w:44, h:28 };
    case 'g': return { x:e.x - 18, y:e.y - 48, w:36, h:48 };
    case 'p': return { x:e.x - 17, y:e.y - 36 + e.oy, w:34, h:36 };
    case 'w': { const cy = e.y - 30 + e.oy; return { x:e.x - 17, y:cy - 14, w:34, h:28 }; }
    case 'f': return { x:e.x - 18, y:e.y - 30 + e.oy, w:36, h:30 };
    case 'b': { const cy = e.y - 30 + e.oy; return { x:e.x - 17, y:cy - 14, w:34, h:28 }; }
    case 'd': return { x:e.x - 22, y:e.y - 44, w:42, h:44 };
    default:  return { x:e.x - 19, y:e.y - 44, w:38, h:44 };
  }
}
function tipOver(e){ e.alive = false; e.tip = 0; e.t = 0; sparkle(e.x, e.y - 40, '#ffe36b', 10); puff(e.x + 20, e.y - 6, 5); }
function killEnemy(e){ e.alive = false; puff(e.x, e.y - 22, 9); sparkle(e.x, e.y - 30, '#ffe36b', 8); }

function updateEnemies(dt, active){
  for (const e of lvl.enemies){
    if (e.tip !== undefined){ e.tip = Math.min(1, e.tip + dt * 2.5); e.t += dt; continue; }
    if (!e.alive) continue;
    if (Math.abs(e.x - cam - W / 2) > W) continue;
    e.t += dt; e.mouth = Math.max(0, e.mouth - dt);
    if ((e.type === 's' || e.type === 'g') && active){
      e.x += e.dir * (e.type === 'g' ? 45 : 28) * dt;
      const fx = e.x + e.dir * 24, fc = Math.floor(fx / T), r = Math.floor((e.y - 6) / T), rg = Math.floor((e.y + 6) / T);
      if (solidAt(fc, r) || !solidAt(fc, rg)) e.dir *= -1;
    } else if (e.type === 'f' || e.type === 'p'){
      e.hop -= dt;
      if (e.oy === 0 && e.hop <= 0){ e.ovy = e.type === 'p' ? -430 : -560; e.hop = 1.2 + Math.random() * 0.6; }
      if (e.oy < 0 || e.ovy < 0){ e.ovy += GRAV * dt; e.oy += e.ovy * dt; if (e.oy >= 0){ e.oy = 0; e.ovy = 0; } }
    } else if (e.type === 'b' || e.type === 'w'){
      e.oy = Math.sin(e.t * 2.2) * 44;
    }
    if (!active) continue;
    if (e.type === 'd' || e.type === 'k'){
      const dx = e.x - (p.x + p.w / 2);
      if (dx > 110 && dx < W * 0.72){ e.cd -= dt; if (e.cd <= 0){ shoot(e); e.cd = e.type === 'd' ? 2.3 : 2.7; e.mouth = 0.35; } }
    }
    const b = ebox(e), pb = { x:p.x + 3, y:p.y - p.h + 6, w:p.w - 6, h:p.h - 6 };
    if (overlap(b, pb)){
      if (p.vy > 60 && p.prevY <= b.y + 16){ killEnemy(e); p.vy = -560; p.onGround = false; sfx('stomp'); }
      else if (p.shield && e.x > p.x + p.w / 2){ if (e.type === 's'){ e.dir = 1; e.x += 4; } }
      else hurt();
    }
  }
}

function shoot(e){
  sfx('shoot');
  if (e.type === 'd'){
    const mx = e.x - 26, my = e.y - 28, tx = p.x + p.w / 2, ty = p.y - 30;
    let dx = tx - mx, dy = ty - my; const len = Math.hypot(dx, dy) || 1;
    let vx = dx / len * 230, vy = dy / len * 230; if (vx > -130) vx = -130;
    projs.push({ x:mx, y:my, vx, vy, r:10, type:'fire', refl:false, life:5, owner:e });
  } else {
    projs.push({ x:e.x - 20, y:e.y - 20, vx:-220, vy:0, r:8, type:'acorn', refl:false, life:5, spin:0, owner:e });
  }
}

function updateProjs(dt){
  for (const q of projs){
    q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
    if (q.type === 'acorn'){ q.spin = (q.spin || 0) + dt * (q.refl ? 14 : -10); }
    if (q.type === 'fire' && Math.random() < 0.5) parts.push({ kind:'ember', x:q.x, y:q.y, vx:-q.vx * 0.1 + (Math.random() - .5) * 30, vy:(Math.random() - .5) * 30, life:0.3, max:0.3, g:0, size:4 + Math.random() * 3 });
    if (solidAt(Math.floor(q.x / T), Math.floor(q.y / T))){ q.dead = true; puff(q.x, q.y, 3); continue; }
    if (!q.refl){
      if (p.shield){
        const sb = { x:p.x + p.w - 4, y:p.y - p.h - 16, w:26, h:p.h + 16 };
        if (circBox(q, sb)){
          q.refl = true; q.life = 4;
          const o = q.owner;
          if (o && o.alive){ const dx = o.x - q.x, dy = (o.y - 22) - q.y, len = Math.hypot(dx, dy) || 1; q.vx = dx / len * 380; q.vy = dy / len * 380; }
          else { q.vx = Math.abs(q.vx) + 160; q.vy = -60; }
          sfx('clang'); sparkle(q.x, q.y, '#fff7c2', 10); continue;
        }
      }
      const pb = { x:p.x + 4, y:p.y - p.h + 6, w:p.w - 8, h:p.h - 6 };
      if (p.inv <= 0 && circBox(q, pb)){ q.dead = true; puff(q.x, q.y, 4); hurt(); }
    } else {
      for (const e of lvl.enemies){
        if (e.alive && circBox(q, ebox(e))){ if (e.type === 'k') tipOver(e); else killEnemy(e); q.dead = true; sfx('stomp'); break; }
      }
    }
    if (q.life <= 0 || q.x < cam - 120 || q.x > cam + W + 240 || q.y > H + 60) q.dead = true;
  }
  projs = projs.filter(q => !q.dead);
}

function collectHearts(){
  const cx = p.x + p.w / 2, cy = lvl.space ? p.y : p.y - p.h / 2;
  for (const hh of lvl.heal || []){
    if (hh.got) continue;
    const dx = hh.x - cx, dy = hh.y - cy;
    if (dx * dx + dy * dy < 40 * 40){
      hh.got = true; if (hearts < MAX_HEARTS) hearts++;
      sfx('heal'); sparkle(hh.x, hh.y, '#ff6f91', 14); sparkle(hh.x, hh.y, '#ffffff', 8);
    }
  }
}
function drawHealHearts(){
  for (const hh of lvl.heal || []){
    if (hh.got) continue;
    const x = hh.x - cam; if (x < -40 || x > W + 40) continue;
    const y = hh.y + Math.sin(t * 3 + hh.x) * 5, pul = 1 + Math.sin(t * 6) * 0.08;
    g.fillStyle = 'rgba(255,111,145,.3)'; circ(g, x, y, 26 * pul); g.fill();
    g.save(); g.translate(x, y); g.scale(pul, pul); heart(0, 2, 15, true); g.restore();
    g.fillStyle = '#ffffff'; starPath(g, x + 14, y - 14, 5, 2); g.fill();
  }
}
function collectStars(){
  const cx = p.x + p.w / 2, cy = lvl.space ? p.y : p.y - p.h / 2;
  for (const s of lvl.stars){
    if (s.got) continue;
    const dx = s.x - cx, dy = s.y - cy;
    if (dx * dx + dy * dy < 36 * 36){ s.got = true; got++; sfx('star'); sparkle(s.x, s.y, '#ffd93d', 10); }
  }
}

function checkGoal(){
  if (lvl.goal && p.x + p.w / 2 >= lvl.goal.x - 30 && p.onGround){
    state = 'win'; endT = 2.1; p.shield = false; sfx('win');
    recordWin(lvl.mode, lvlIndex, got); p.suck = false;
    confetti(lvl.goal.x, lvl.goal.y - 180, 70);
  }
}

/* ---------- particles ---------- */
function addPart(o){ if (parts.length < 500) parts.push(o); }
function puff(x, y, n){ for (let i = 0; i < n; i++){ const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 90; addPart({ kind:'puff', x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s - 30, life:0.5, max:0.5, g:0, size:8 + Math.random() * 8 }); } }
function sparkle(x, y, color, n){ for (let i = 0; i < n; i++){ const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 160; addPart({ kind:'spark', x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life:0.5, max:0.5, g:300, size:4 + Math.random() * 3, color }); } }
function dust(x, y){ for (let i = 0; i < 4; i++) addPart({ kind:'puff', x:x + (Math.random() - .5) * 20, y:y - 4, vx:(Math.random() - .5) * 80, vy:-20 - Math.random() * 30, life:0.35, max:0.35, g:0, size:5 + Math.random() * 4 }); }
const CONF = ['#ff5d6c','#ffd93d','#5fd4c4','#6ec3ff','#b48cff','#ffffff'];
function confetti(x, y, n){ for (let i = 0; i < n; i++){ const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, s = 200 + Math.random() * 300; addPart({ kind:'conf', x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life:2.2, max:2.2, g:420, size:6 + Math.random() * 5, color:CONF[i % CONF.length], rot:Math.random() * 6 }); } }
function updateParts(dt){
  for (const q of parts){ q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt; q.life -= dt; if (q.kind === 'conf'){ q.vx *= 0.99; q.rot += dt * 8; } }
  parts = parts.filter(q => q.life > 0);
}

/* ---------- main step ---------- */
function step(dt){
  t += dt;
  if (state === 'menu' || state === 'levels'){
    cam += 55 * dt; if (cam > lvl.width - W) cam = 0;
    if (lvl.party){ cam = 0; camY = (lvl.HH - H) * (0.5 + 0.5 * Math.sin(t * 0.25)); updateParty(dt, false); }
    else lvl.space ? updateSpace(dt, false) : updateEnemies(dt, false);
  } else if (state === 'ready'){
    readyT -= dt; if (lvl.party) partyCamera(dt, false); else lvl.space ? updateSpace(dt, false) : updateEnemies(dt, false);
    if (readyT <= 0) state = 'play';
  } else if (state === 'play'){
    playT += dt;
    if (lvl.party){ updatePartyPlayer(dt); updateParty(dt, true); collectStars(); collectHearts(); checkPartyGoal(); partyCamera(dt, false); }
    else if (lvl.space){ updateAstro(dt); updateSpace(dt, true); updateSpaceProjs(dt); collectStars(); collectHearts(); checkSpaceGoal(); }
    else { updatePlayer(dt); updateEnemies(dt, true); updateProjs(dt); collectStars(); collectHearts(); if (lvl.school) suckSweets(dt); checkGoal(); }
  } else if (state === 'dying'){
    p.vy += (lvl.space ? 700 : GRAV) * dt; p.y += p.vy * dt; p.rot += dt * 7; if (lvl.space) updateSpace(dt, false); if (lvl.party) updateParty(dt, false);
    endT -= dt; if (endT <= 0){ state = 'over'; showOver(); }
  } else if (state === 'win' && lvl.party){
    endT -= dt; lvl.giftAnim.t += dt; updateParty(dt, false);
    if (Math.random() < 0.2) confetti(lvl.tableX + (Math.random() - .5) * 220, lvl.goal.y - 200, 3);
    if (endT <= 0){ state = 'won'; showWin(); }
  } else if (state === 'win'){
    endT -= dt;
    if (lvl.space){ p.y += (lvl.goal.y - p.y) * Math.min(1, dt * 4); p.thrust = true; updateSpace(dt, false); }
    if (!p.hidden){ p.x += SPEED * 0.7 * dt; p.phase += dt * 10; if (p.x + p.w / 2 > lvl.goal.x + 8){ p.hidden = true; sparkle(lvl.goal.x, lvl.goal.y - 40, '#ffffff', 16); } }
    if (Math.random() < 0.15) confetti(lvl.goal.x + (lvl.space ? 84 : 0) + (Math.random() - .5) * 200, lvl.goal.y - (lvl.space ? 120 : 220), 3);
    if (endT <= 0){ state = 'won'; showWin(); }
  }
  if (p && (state === 'ready' || state === 'play' || state === 'win' || state === 'dying')){
    cam = Math.max(0, Math.min(lvl.width - W, p.x - W * 0.28));
  }
  updateParts(dt);
}

/* ---------- drawing: knights ---------- */
const SKIN = '#ffd9b5', HAIR = '#ffd447', HAIR_D = '#e0a92a', HAIR_L = '#fff1a6', BOOT = '#6b4226', MAIL = '#9aa3b8';
function drawShield(c, cx, cy, w, h, k){
  c.beginPath();
  c.moveTo(cx - w / 2, cy - h / 2 + 4);
  c.quadraticCurveTo(cx - w / 2, cy - h / 2, cx - w / 2 + 4, cy - h / 2);
  c.lineTo(cx + w / 2 - 4, cy - h / 2);
  c.quadraticCurveTo(cx + w / 2, cy - h / 2, cx + w / 2, cy - h / 2 + 4);
  c.lineTo(cx + w / 2, cy + h * 0.08);
  c.quadraticCurveTo(cx + w / 2, cy + h * 0.36, cx, cy + h / 2);
  c.quadraticCurveTo(cx - w / 2, cy + h * 0.36, cx - w / 2, cy + h * 0.08);
  c.closePath();
  c.fillStyle = k.color; c.fill();
  c.lineWidth = Math.max(2, w * 0.12); c.strokeStyle = '#eef3fb'; c.stroke();
  c.lineWidth = 1.2; c.strokeStyle = '#4a5578'; c.stroke();
  fitText(c, k.letter, cx, cy - h * 0.02, w * 0.78, h * 0.62, k.ink || '#ffffff');

function fitText(c, txt, x, y, maxW, size, color){

function drawTiles(th){

        continue;

      if (hash(cc * 3 + 1) < 0.5){ ell(g, x + 6 + hash(cc + 5) * 34, GY + 84 + hash(cc + 2) * 14, 4, 3); g.fill(); }
      const hv = hash(cc * 7 + 2);
      if (hv < 0.35 && tileAt(cc, 8) === ' '){
        const fx = x + 8 + hash(cc + 9) * 30, col = th.flowers[Math.floor(hash(cc + 4) * th.flowers.length)];
        g.strokeStyle = '#3f9a3a'; g.lineWidth = 2; g.beginPath(); g.moveTo(fx, GY); g.lineTo(fx, GY - 12); g.stroke();
        g.fillStyle = col; for (let k = 0; k < 5; k++){ const an = k * 1.2566 + t * 0.5; circ(g, fx + Math.cos(an) * 4, GY - 14 + Math.sin(an) * 4, 3.2); g.fill(); }
        g.fillStyle = '#ffcf3a'; circ(g, fx, GY - 14, 2.4); g.fill();

        g.fillStyle = th.plankDark; for (let sx = x0 + 10; sx < x0 + w; sx += T){ circ(g, sx, y + 8, 2); g.fill(); circ(g, sx + 28, y + 8, 2); g.fill(); }

  const box = $('lvgrid'); box.innerHTML = '';
  const sp = mode === 'space';
  LV().forEach((L, i) => {
    const b = document.createElement('button'); b.className = 'lv';
    const sc = mode === 'school';
    const open = i < unlockedFor(mode); b.disabled = !open;
    const pt = mode === 'party';
    const best = bestFor(mode, i), total = (sp ? buildSpace(i) : pt ? buildParty(i) : buildLevel(i, mode)).totalStars;
    const jd = mode === 'jedi';
    b.style.setProperty('--a', sp ? STHEMES[i].top : sc ? KTHEMES[i].skyTop : jd ? JTHEMES[i].skyTop : pt ? PTHEMES[i].top : THEMES[i].skyTop); b.style.setProperty('--b', sp ? STHEMES[i].bot : sc ? '#c96a4f' : jd ? JTHEMES[i].near : pt ? PTHEMES[i].accent : THEMES[i].near);
    const lock = '<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
    b.innerHTML = `<span class="sky"><span class="num">${i + 1}</span></span><span class="txt"><span class="lvname">${L.name}</span><span class="lvsub">${open ? L.sub : lock + ' Erst Level ' + i + ' schaffen'}</span>${open ? `<span class="lvbest">${best === undefined ? 'Noch kein Rekord' : `${sc ? CANDY_SVG : jd ? CRYSTAL_SVG : pt ? BALLOON_SVG : STAR_SVG} Rekord: ${best} von ${total}`}</span>` : ''}</span>`;
    b.addEventListener('click', () => { sfx('click'); startLevel(i); });
    box.appendChild(b);
  });
  $('lvTitle').textContent = mode === 'party' ? `Wo feiert ${KNIGHTS[knightId].name}?` : `Wohin ${sp ? 'fliegt' : mode === 'school' ? 'läuft' : mode === 'jedi' ? 'reist' : 'reitet'} ${KNIGHTS[knightId].name}?`;
  showScreen('levels');
}
const STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6-4.9-4.5 6.6-.8z" fill="#ffd93d" stroke="#24305e" stroke-width="2" stroke-linejoin="round"/></svg>';
const CANDY_SVG = '<svg viewBox="0 0 24 24"><path d="M7 12 2.5 8.5v7zM17 12l4.5-3.5v7z" fill="#ff5d8f" stroke="#24305e" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="5.5" fill="#ff5d8f" stroke="#24305e" stroke-width="1.8"/></svg>';
function showWin(){
  const k = KNIGHTS[knightId], L = LV(), last = lvlIndex === L.length - 1, sp = !!lvl.space, sc = !!lvl.school, jd = !!lvl.jedi, pt = !!lvl.party;
  $('msgTitle').textContent = last ? 'Alle Abenteuer geschafft!' : 'Hurra, geschafft!';
  $('msgStars').innerHTML = `${sc ? CANDY_SVG : jd ? CRYSTAL_SVG : pt ? BALLOON_SVG : STAR_SVG} ${got} von ${lvl.totalStars}` + (newRecord ? ' <span class="record">Neuer Rekord!</span>' : ` <span class="recordold">Rekord: ${bestFor(lvl.mode, lvlIndex)}</span>`);
  const f = k.sex === 'f';
  $('msgText').textContent = pt ? (last ? `${k.name} hat alle Geschenke gebracht. Das war die schönste Party!` : `${k.name} hat das Geschenk auf den Geburtstagstisch gestellt. Als Nächstes: ${L[lvlIndex + 1].name}!`) : last ? (sp ? `${k.name} ist ${f ? 'die mutigste Astronautin' : 'der mutigste Astronaut'} im ganzen Weltall.` : sc ? `${k.name} ist das fröhlichste Schulkind in ganz Bützow.` : jd ? `${k.name} ist ${f ? 'die mutigste junge' : 'der mutigste junge'} Jedi der ganzen Galaxis.` : `${k.name} ist ${f ? 'die tapferste Ritterin' : 'der tapferste Ritter'} im ganzen Land.`) : `${k.name} hat ${sp ? 'die Raumstation' : sc ? 'die Schule' : jd ? (f ? 'ihr Raumschiff' : 'sein Raumschiff') : 'die Burg'} erreicht. Als Nächstes: ${L[lvlIndex + 1].name}!`;
  $('msgA').textContent = last ? 'Nochmal von vorn' : 'Nächstes Level';
  $('msgA').onclick = () => { sfx('click'); startLevel(last ? 0 : lvlIndex + 1); };
  $('msgB').textContent = 'Zum Menü';
  $('msgB').onclick = () => { sfx('click'); openLevels(); };
  showScreen('msg');
  $('btnSound').hidden = false;
}
function showOver(){
  $('msgTitle').textContent = 'Oh nein!';
  $('msgStars').innerHTML = '';
  $('msgText').textContent = 'Keine Herzen mehr. Versuch es gleich noch einmal!';
  $('msgA').textContent = 'Nochmal';
  $('msgA').onclick = () => { sfx('click'); startLevel(lvlIndex); };
  $('msgB').textContent = 'Zum Menü';
  $('msgB').onclick = () => { sfx('click'); openLevels(); };
  showScreen('msg');
}
// Home is always top left: from a level or a result back to the level choice, from the level choice back to the start menu
$('btnHome').addEventListener('click', e => { e.stopPropagation(); sfx('click'); if (state === 'levels') goMenu(); else openLevels(); });
function syncSound(){ $('btnSound').classList.toggle('off', muted); }
$('btnSound').addEventListener('click', e => { e.stopPropagation(); muted = !muted; save('muted', muted); syncSound(); if (!muted) sfx('click'); });
syncSound();

/* ---------- input ---------- */
const pointers = new Set();
function onDown(e){
  if (state !== 'play' && state !== 'ready') return;
  e.preventDefault(); pointers.add(e.pointerId); press();
}
function onUp(e){ if (pointers.delete(e.pointerId) && pointers.size === 0) release(); }
$('stage').addEventListener('pointerdown', onDown);
$('jump').addEventListener('pointerdown', onDown);
addEventListener('pointerup', onUp); addEventListener('pointercancel', onUp);
addEventListener('contextmenu', e => { if (state === 'play' || state === 'ready') e.preventDefault(); });
const KEYS = ['Space', 'ArrowUp', 'KeyW'];
addEventListener('keydown', e => {
  if (KEYS.includes(e.code) && (state === 'play' || state === 'ready')){ e.preventDefault(); if (!e.repeat) press(); }
  else if (e.code === 'Escape' && (state === 'play' || state === 'ready')) openLevels();
});
addEventListener('keyup', e => { if (KEYS.includes(e.code)) { e.preventDefault(); release(); } });
addEventListener('blur', () => { pointers.clear(); input.down = false; });

/* ---------- HUD (HTML, so it never hides behind the buttons) ---------- */
const HEART_SVG = '<svg viewBox="0 0 30 28"><path d="M15 26C6 19 1.5 14 1.5 8.5 1.5 4.6 4.6 1.5 8.4 1.5c2.7 0 5 1.4 6.6 3.7 1.6-2.3 3.9-3.7 6.6-3.7 3.8 0 6.9 3.1 6.9 7 0 5.5-4.5 10.5-13.5 17.5z" fill="#ff4f6a" stroke="#24305e" stroke-width="2.6" stroke-linejoin="round"/></svg>';
const BALLOON_SVG = '<svg viewBox="0 0 24 24"><path d="M12 17c-4 0-6.5-4-6.5-8a6.5 6.5 0 0 1 13 0c0 4-2.5 8-6.5 8z" fill="#ff6f91" stroke="#24305e" stroke-width="1.8"/><path d="M12 17v5" stroke="#24305e" stroke-width="1.5"/></svg>';
const CRYSTAL_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2 18 9 16 22H8L6 9z" fill="#6fe3ff" stroke="#24305e" stroke-width="1.8" stroke-linejoin="round"/></svg>';
let hudKey = '';
function syncHud(){
  if (!lvl || state === 'menu' || state === 'levels') return;
  const key = hearts + '|' + got + '|' + lvl.totalStars + '|' + lvl.mode;
  if (key === hudKey) return; hudKey = key;
  let h = ''; for (let i = 0; i < MAX_HEARTS; i++) h += i < hearts ? HEART_SVG : HEART_SVG.replace('<svg', '<svg class="empty"');
  $('hearts').innerHTML = h; $('hearts').setAttribute('aria-label', `${hearts} von ${MAX_HEARTS} Leben`);
  const icon = lvl.school ? CANDY_SVG : lvl.jedi ? CRYSTAL_SVG : lvl.party ? BALLOON_SVG : STAR_SVG;
  $('count').innerHTML = `${icon}<span>${got} / ${lvl.totalStars}</span>`;
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0;
const jumpBtn = $('jump');
function frame(nowMs){
  let d = (nowMs - last) / 1000; last = nowMs; if (d > 0.1) d = 0.1;
  acc += d; const STEP = 1 / 120;
  while (acc >= STEP){ step(STEP); acc -= STEP; }
  render();
  syncHud();
  if (state === 'menu') drawPreviews();
  jumpBtn.classList.toggle('down', input.down);
  jumpBtn.classList.toggle('shielding', !!(p && p.shield));
  requestAnimationFrame(frame);
}

function boot(data){
  if (data && KNIGHTS[data.knight]) knightId = data.knight;
  if (data && ['space', 'knight', 'school', 'jedi', 'party'].includes(data.mode)) mode = data.mode;
  setMode(mode);
  showScreen('menu');
  requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({ knight: knightId, mode })); } catch(e){}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
